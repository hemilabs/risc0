# P31-14: a verifier built ONLY from the released crates.io risc0 3.1 crates.
#
# It is deliberately not a member of the risc0 workspace (own [workspace] below), has no path
# dependencies and no [patch] section, so nothing from this repository's sources can reach it.
# build.rs refuses to build unless Cargo.lock says every risc0 package comes from the crates.io
# registry. Default features are off: verification only (no prover, no GPU kernels, no risc0-sys).
[package]
name = "stock-verify31"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
risc0-circuit-recursion = { version = "=4.1.0", default-features = false }
risc0-circuit-rv32im = { version = "=4.1.0", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }
