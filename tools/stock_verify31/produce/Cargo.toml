# P31-14: makes the receipts that `stock-verify31` judges, with THIS tree's Metal prover.
#
# Not a member of the risc0 workspace (own [workspace]). Path dependencies point at the tree this
# directory lives in; run_matrix.sh builds a copy with them pointed at the frozen 3.0 tree to make
# the 3.0 receipts. Its Cargo.lock is not committed (it follows the tree it is built against).
[package]
name = "p31-14-produce"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
metal = "0.29"
risc0-circuit-keccak = { path = "../../../risc0/circuit/keccak", features = ["metal"] }
risc0-circuit-recursion = { path = "../../../risc0/circuit/recursion", features = ["metal"] }
risc0-circuit-rv32im = { path = "../../../risc0/circuit/rv32im", features = ["metal"] }
risc0-groth16 = { path = "../../../risc0/groth16", features = ["metal"] }
risc0-groth16-sys = { path = "../../../risc0/groth16-sys", features = ["metal"] }
risc0-zkvm = { path = "../../../risc0/zkvm", features = ["metal"] }
risc0-zkvm-methods = { path = "../../../risc0/zkvm/methods" }

[profile.release]
debug = 1
