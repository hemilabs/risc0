[package]
name = "risc0-groth16-sys"
description = "C++ code for groth16 proof generation"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
links = "risc0-groth16-sys"

[build-dependencies]
risc0-build-kernel = { workspace = true }

[dependencies]
anyhow = "1.0.98"
blst = { version = "0.3.15", optional = true }
risc0-sys = { workspace = true, optional = true }
sppark = { workspace = true, optional = true }
# Metal Groth16 prover host side (src/metal/): BN254 reference arithmetic, SRS/zkey parsing, host-side
# group operations (blinding, Horner) and polynomial domains. Same versions risc0-groth16 already uses.
ark-bn254 = { version = "0.5.0", optional = true }
ark-ec = { version = "0.5.0", optional = true }
ark-ff = { version = "0.5.0", optional = true }
ark-poly = { version = "0.5.0", optional = true }
ark-serialize = { version = "0.5", optional = true }
ark-std = { version = "0.5.0", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = { workspace = true, optional = true }

[dev-dependencies]
test-log = { version = "0.2.17", default-features = false, features = [
  "trace",
] }
tracing = "0.1.41"
# Metal kernel equivalence tests against arkworks (random field/curve inputs, ChaCha8 reference).
rand = "0.8.5"
rand_chacha = "0.3.1"

[features]
default = []
cuda = ["dep:blst", "dep:sppark", "dep:risc0-sys", "risc0-sys/cuda"]
rocm = ["dep:blst", "dep:sppark", "dep:risc0-sys", "risc0-sys/rocm"]
# The SYCL prover for Intel GPUs (kernels/intel); needs oneAPI (icpx).
intel = []
metal = [
  "dep:risc0-sys",
  "risc0-sys/metal",
  "dep:metal",
  "dep:ark-bn254",
  "dep:ark-ec",
  "dep:ark-ff",
  "dep:ark-poly",
  "dep:ark-serialize",
  "dep:ark-std",
]
setup = []
