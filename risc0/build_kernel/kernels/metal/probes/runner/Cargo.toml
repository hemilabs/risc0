# Day-0 Metal runtime probe runner (plan item D0). Standalone on purpose: the empty
# [workspace] table keeps it out of the risc0 workspace so it never affects workspace builds.
#
#   source /Users/user/zkminer/env.sh
#   cargo run --release --manifest-path risc0/build_kernel/kernels/metal/probes/runner/Cargo.toml -- all
[package]
name = "risc0-metal-probes-runner"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
metal = "0.29"
objc = "0.2"
